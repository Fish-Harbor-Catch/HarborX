services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harborx
      POSTGRES_USER: harborx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - harborx_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborx -d harborx"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://harborx:${POSTGRES_PASSWORD}@database:5432/harborx
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5050}
      DEMO_SEED: "false"
      COMMISSION_RATE: "5"
      PAYMENT_DUE_HOURS: "48"
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  harborx_database:
