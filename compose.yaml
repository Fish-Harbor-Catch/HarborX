services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harborx}
      POSTGRES_USER: ${POSTGRES_USER:-harborx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - harborx_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harborx} -d ${POSTGRES_DB:-harborx}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-harborx}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-harborx}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5000,http://127.0.0.1:5000}
      DEMO_SEED: ${DEMO_SEED:-false}
      COMMISSION_RATE: ${COMMISSION_RATE:-5}
      PAYMENT_DUE_HOURS: ${PAYMENT_DUE_HOURS:-48}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  harborx_database:
